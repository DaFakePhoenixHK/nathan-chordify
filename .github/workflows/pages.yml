# Publishes the phone app to GitHub Pages. It contains no songs and no codes: the app connects to
# your own computer after you pair it.
name: Publish the phone app
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: web
      - run: npm run build:app
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-app
      - id: deployment
        uses: actions/deploy-pages@v4
