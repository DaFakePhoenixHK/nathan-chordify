# Candidate worship songs for building a labelled chord dataset (Nathan_chordify, restarted 2026-11-01).
# Research only: nothing here was bulk-downloaded. See docs/DATA_PLAN.md for the plan and source rules.
#
# Counts: 64 English, 42 Cantonese, 22 Mandarin (secondary pool) = 128 songs.
# Many entries are PARTIAL on purpose (e.g. key/BPM only where a page was actually read).
#
# Field guide
#   priority: user      -> the four songs Nathan asked for first (top of the file)
#   first20: N          -> recommended processing order (1-20), see DATA_PLAN.md section 6
#   key / key_note      -> the key a source states; ALWAYS re-check against the recording (charts are often transposed)
#   youtube             -> recordings are for TESTING only (user rule). 'search:' = a search hint, no URL checked.
#   sheets              -> notated music (PDF/images); charts -> chord charts (chords over lyrics)
#   free_without_login  -> true = we could read it with no account; false = needs login/payment; null = unknown
#   musescore.download_without_login is ALWAYS false: musescore.com needs a login for every download, and a paid
#                          Pro plan for copyrighted songs (all of these). Pages were not opened (Cloudflare human check).
#   verified: true      -> we actually opened that page/file on 2026-11-01 (for CantonHymn: read via the site's own
#                          song-detail data). verified: false -> found via search engine / site index only.
#   Sites: WorshipTogether = worshiptogether.com, CantonHymn = cantonhymn.net, Simply Worship = simplyworship.hk,
#          ABS = spcl.abs.edu (建道神學院), Clay Music = claymusic.org (泥土音樂).

